<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClothForge 自由下落</title>
<style>body{margin:0;background:#0c1420;color:#dbe7f4;font:15px system-ui}header{padding:14px 20px;border-bottom:1px solid #324257;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#203249;color:#fff;border:1px solid #52667c;border-radius:7px;padding:7px 15px;cursor:pointer}main{max-width:1100px;margin:auto;padding:14px}#image{width:100%;max-height:70vh;object-fit:contain;background:#05090e}nav{display:flex;gap:8px;padding:10px 0}#status{padding:10px;background:#142233;border-radius:7px;white-space:pre-wrap}details{margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a8c1d9}</style>
<header><strong>ClothForge 自由下落 · 无机械臂</strong><button data-command="pause">暂停</button><button data-command="resume">继续</button><button data-command="reset">重置衣物</button><span id="connection">连接中…</span></header>
<main><img id="image" alt="衣物物理观察画面"><nav><button data-camera="0">正视</button><button data-camera="1">俯视</button><button data-camera="2">左斜视</button><button data-camera="3">右斜视</button></nav><div id="status">等待仿真状态…</div><details><summary>求解参数与诊断</summary><pre id="details"></pre></details></main>
<script>
const ws=new WebSocket(location.href.replace(/^http/,'ws')), urls=new Map();let selected=0;ws.binaryType='arraybuffer';
ws.onopen=()=>document.querySelector('#connection').textContent='已连接';ws.onclose=()=>document.querySelector('#connection').textContent='连接已断开';
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'observation',command:b.dataset.command}))});
document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.camera);if(urls.has(selected))document.querySelector('#image').src=urls.get(selected)});
ws.onmessage=event=>{if(typeof event.data==='string'){const s=JSON.parse(event.data);if(s.type==='error'){document.querySelector('#connection').textContent=s.message;return}document.querySelector('#status').textContent=`${s.paused?'已暂停':'运行中'} · 纯 VBD · ${s.cloth_node_count} 顶点 · 平均物理 ${(s.physics_actual_hz??0).toFixed(1)} 步/秒 · 平均 RTF ${(s.real_time_factor??0).toFixed(3)}\n仿真 ${(s.simulation_time_s??0).toFixed(2)} 秒 · 重置 ${s.reset_count??0} 次 · 高度 ${s.cloth_z_range_m?.map(v=>v.toFixed(3)).join(' ～ ')??'等待'} m\n接触 ${s.soft_contact_count??0} / 容量 ${s.soft_contact_capacity??0}`;document.querySelector('#details').textContent=JSON.stringify({simulation:s.simulation_numerics,shape_count:s.shape_count,color_group_sizes:s.color_group_sizes,previews:s.previews},null,2);return}
const view=new DataView(event.data);if(view.byteLength<22)return;const camera=view.getUint8(5),url=URL.createObjectURL(new Blob([event.data.slice(22)],{type:'image/jpeg'})),old=urls.get(camera);urls.set(camera,url);if(camera===selected)document.querySelector('#image').src=url;if(old)URL.revokeObjectURL(old)};
</script></html>
