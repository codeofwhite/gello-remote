[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gello-remote"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gello-remote-isaaclab-smoke = "gello_remote.isaaclab_smoke:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
